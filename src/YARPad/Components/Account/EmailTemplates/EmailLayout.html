<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #f5f5f5; padding: 40px 0;">
        <tr>
            <td align="center">
                <table cellpadding="0" cellspacing="0" border="0" width="600" style="background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
                    <!-- Header with Logo -->
                    <tr>
                        <td align="center" style="padding: 32px 40px 24px 40px; border-bottom: 3px solid #037ad5;">
                            <table cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="vertical-align: middle;">
                                        <img src="cid:yarpad-logo" width="40" height="24" alt="YARPad" style="display: block;" />
                                    </td>
                                    <td style="padding-left: 16px; vertical-align: middle;">
                                        <img src="cid:yarpad-text" width="93" height="20" alt="YARPad" style="display: block;" />
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- Title -->
                    <tr>
                        <td style="padding: 32px 40px 0 40px;">
                            <h1 style="margin: 0 0 24px 0; color: #1a1a1a; font-size: 28px; font-weight: 700; line-height: 1.3;">
                                {{TITLE}}
                            </h1>
                        </td>
                    </tr>
                    <!-- Content -->
                    <tr>
                        <td style="padding: 0 40px 32px 40px;">
                            {{CONTENT}}
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding: 24px 40px 32px 40px; background-color: #f8f9fa; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;">
                            <p style="margin: 0; color: #666666; font-size: 14px; line-height: 1.5;">
                                © {{YEAR}} YARPad - YARP Administration Dashboard
                            </p>
                            <p style="margin: 8px 0 0 0; color: #999999; font-size: 12px; line-height: 1.5;">
                                This is an automated message, please do not reply to this email.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
